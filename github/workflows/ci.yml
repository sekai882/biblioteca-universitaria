name: Maven CI - Calidad de Software

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: 1. Compilacion Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar el proyecto
        run: mvn -B clean compile


  test:
    name: 2. Pruebas unitarias JUnit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas JUnit
        run: mvn -B test

      - name: Publicar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          if-no-files-found: warn
          path: target/surefire-reports/


  coverage:
    name: 3. Cobertura JaCoCo
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas y generar cobertura
        run: mvn -B clean verify

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          if-no-files-found: warn
          path: target/site/jacoco/


  checkstyle:
    name: 4. Analisis Checkstyle
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: Publicar reporte Checkstyle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          if-no-files-found: warn
          path: |
            target/reports/checkstyle.html
            target/site/checkstyle.html
            target/checkstyle-result.xml


  pmd:
    name: 5. Analisis PMD
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar PMD
        run: mvn -B pmd:pmd

      - name: Publicar reporte PMD
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          if-no-files-found: warn
          path: |
            target/reports/pmd.html
            target/site/pmd.html
            target/pmd.xml


  spotbugs:
    name: 6. Analisis SpotBugs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y ejecutar SpotBugs
        run: mvn -B compile spotbugs:spotbugs

      - name: Publicar reporte SpotBugs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          if-no-files-found: warn
          path: |
            target/spotbugs*.xml
            target/spotbugs*.html
            target/reports/spotbugs*.html